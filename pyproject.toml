[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ines"
version = "0.1.0"
description = "Integer Natural Evolution Strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jacob de Nobel" }
]
keywords = [
  "evolution strategies",
  "natural evolution strategies",
  "integer optimization",
  "discrete optimization",
  "black-box optimization",
  "double geometric distribution"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "ioh",
  "numpy",
  "matplotlib",
  "scipy"
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "build>=1.2",
  "twine>=5.0"
]
examples = [
  "cma",
  "iohinspector",
  "pandas"
]

[project.urls]
Homepage = "https://github.com/jacobdenobel/ines"
Repository = "https://github.com/jacobdenobel/ines"
Issues = "https://github.com/jacobdenobel/ines/issues"

[project.scripts]
ines = "ines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ines"]
